[build]
  command = "npm run verify"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."scheduler"]
  schedule = "*/10 * * * *"

[dev]
  command = "npm run dev:site"
  port = 8888
  targetPort = 5174
  framework = "#static"

[[headers]]
  for = "/snapshots/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/latest/*"
  [headers.values]
    Cache-Control = "public, max-age=60, stale-while-revalidate=300"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/catalog.json"
  [headers.values]
    Cache-Control = "public, max-age=60, stale-while-revalidate=300"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=60, stale-while-revalidate=300"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/snapshots/index.json"
  [headers.values]
    Cache-Control = "public, max-age=60, stale-while-revalidate=300"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*.txt"
  [headers.values]
    Cache-Control = "public, max-age=300"
    X-Content-Type-Options = "nosniff"

[[redirects]]
  from = "/api/search"
  to = "/.netlify/functions/search"
  status = 200

[[redirects]]
  from = "/api/admin"
  to = "/.netlify/functions/admin"
  status = 200
