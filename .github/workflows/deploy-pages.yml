name: Deploy GitHub Pages

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Force rebuild before deploy"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: forkcast-data-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      FORKCAST_PUBLIC_BASE_PATH: /forkcast-data
      FORKCAST_RAW_RECORD_BASE: https://raw.githubusercontent.com/dionysuzx/forkcast-data/${{ github.sha }}/records
      FORKCAST_STATIC_HOST: github-pages
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run verify
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
