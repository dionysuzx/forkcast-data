name: Dummy 30 Minute Smoke

on:
  workflow_dispatch:
    inputs:
      acknowledge_dummy_only:
        description: "Must be true; this workflow never publishes production data"
        required: true
        default: false
        type: boolean

jobs:
  smoke:
    if: ${{ inputs.acknowledge_dummy_only == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: ENABLE_DUMMY_PIPELINE=true npm run dummy:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: dummy-e2e-dist
          path: dist
