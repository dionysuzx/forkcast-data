name: Dispatch Astro

on:
  workflow_dispatch:
    inputs:
      target_snapshot:
        description: "Snapshot ID to pin in forkcast-astro"
        required: true
        type: string
      force_rebuild:
        description: "Force Astro rebuild"
        default: false
        type: boolean

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch forkcast-astro
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.FORKCAST_ASTRO_DISPATCH_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'dionysuzx',
              repo: 'forkcast-astro',
              event_type: 'forkcast-data-snapshot',
              client_payload: {
                snapshot: '${{ inputs.target_snapshot }}',
                force: '${{ inputs.force_rebuild }}'
              }
            })
