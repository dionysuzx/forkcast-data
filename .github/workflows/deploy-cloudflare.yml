name: Deploy Cloudflare Pages

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Force rebuild before deploy"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: forkcast-data-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages
      url: https://forkcast-data.pages.dev
    env:
      FORKCAST_RAW_RECORD_BASE: https://raw.githubusercontent.com/dionysuzx/forkcast-data/${{ github.sha }}/records
      FORKCAST_STATIC_HOST: cloudflare-pages
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run verify
      - name: Deploy to Cloudflare Pages
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN secret is required for Cloudflare Pages deploys" >&2
            exit 1
          fi
          npx wrangler pages deploy dist \
            --project-name forkcast-data \
            --branch main \
            --commit-hash "${GITHUB_SHA}" \
            --commit-message "Forkcast data deploy ${GITHUB_SHA}"
