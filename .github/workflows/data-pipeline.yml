name: Data Pipeline

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Source selection"
        required: true
        default: "canonical"
        type: choice
        options: ["canonical", "all", "eips", "forkcast", "pm-lean", "github-pm-issues", "discord-archive", "discourse", "dummy"]
      source_limit:
        description: "Per-source limit; 0 means full source where supported"
        required: false
        default: "0"
        type: string
      dummy_mode:
        description: "Enable deterministic dummy mode"
        required: false
        default: false
        type: boolean
      target_snapshot:
        description: "Optional target snapshot label"
        required: false
        type: string
      force_rebuild:
        description: "Force rebuild"
        required: false
        default: false
        type: boolean
      eval_bypass_reason:
        description: "Named audit reason required to bypass eval failures"
        required: false
        type: string
      pm_lean_bundle:
        description: "Optional pm-lean dispatch bundle path or artifact note"
        required: false
        type: string
  schedule:
    - cron: "37 0,12 * * *"

concurrency:
  group: forkcast-data-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages
      url: https://forkcast-data.pages.dev
    permissions:
      contents: write
      actions: read
    env:
      SOURCE: ${{ inputs.source || vars.FORKCAST_DATA_PIPELINE_SOURCE || 'canonical' }}
      SOURCE_LIMIT: ${{ inputs.source_limit || vars.FORKCAST_DATA_SOURCE_LIMIT || '0' }}
      PM_LEAN_FEED_REF: ${{ vars.PM_LEAN_FEED_REF || 'pm-lean-feed' }}
      PM_LEAN_OUT: ${{ github.workspace }}/pm-lean-feed
      FORKCAST_ROOT: ${{ github.workspace }}/forkcast
      EIPS_ROOT: ${{ github.workspace }}/upstream-eips
      ETH_RND_ARCHIVE_ROOT: ${{ github.workspace }}/eth-rnd-archive
      GH_TOKEN: ${{ github.token }}
      FORCE_REBUILD: ${{ inputs.force_rebuild || 'false' }}
      FORKCAST_DATA_SITE_URL: ${{ vars.FORKCAST_DATA_SITE_URL || 'https://forkcast-data.pages.dev' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name || 'main' }}
          fetch-depth: 0
      - name: Checkout pm-lean feed
        if: ${{ env.SOURCE == 'canonical' || env.SOURCE == 'all' || env.SOURCE == 'pm-lean' }}
        continue-on-error: true
        uses: actions/checkout@v6
        with:
          repository: dionysuzx/pm-lean
          ref: ${{ env.PM_LEAN_FEED_REF }}
          path: pm-lean-feed
      - name: Checkout official EIPs
        if: ${{ env.SOURCE == 'canonical' || env.SOURCE == 'all' || env.SOURCE == 'eips' }}
        uses: actions/checkout@v6
        with:
          repository: ethereum/EIPs
          path: upstream-eips
      - name: Checkout Forkcast source
        if: ${{ env.SOURCE == 'canonical' || env.SOURCE == 'all' || env.SOURCE == 'forkcast' || env.SOURCE == 'eips' }}
        uses: actions/checkout@v6
        with:
          repository: dionysuzx/forkcast
          path: forkcast
      - name: Checkout Ethereum R&D archive
        if: ${{ env.SOURCE == 'canonical' || env.SOURCE == 'all' || env.SOURCE == 'discord-archive' }}
        uses: actions/checkout@v6
        with:
          repository: ethereum/eth-rnd-archive
          path: eth-rnd-archive
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Record pipeline input
        run: |
          echo "source=${SOURCE}"
          echo "source_limit=${SOURCE_LIMIT}"
          echo "pm_lean_bundle=${{ inputs.pm_lean_bundle }}"
          if [ -f "$PM_LEAN_OUT/catalog.json" ]; then
            node -e "const c=require(process.env.PM_LEAN_OUT + '/catalog.json'); console.log('pm_lean_records=' + c.entries.length)"
          else
            echo "pm_lean_records=0"
          fi
      - name: Backfill
        run: |
          if [ "$SOURCE" = "dummy" ]; then
            ENABLE_DUMMY_PIPELINE=true npm run ingest -- --source dummy --dummy true
          else
            npm run backfill -- --source "$SOURCE" --limit "$SOURCE_LIMIT" --pm-lean-out "$PM_LEAN_OUT" --forkcast-root "$FORKCAST_ROOT" --eips-root "$EIPS_ROOT" --eth-rnd-archive-root "$ETH_RND_ARCHIVE_ROOT"
          fi
      - run: npm run derive
      - run: npm run validate
      - name: Persist canonical files
        id: canonical
        if: ${{ env.SOURCE != 'dummy' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add records catalog.json
          if git diff --cached --quiet; then
            echo "No canonical record changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update canonical Forkcast data"
            git push origin "HEAD:${GITHUB_REF_NAME:-main}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Skip unchanged scheduled deploy
        if: ${{ env.SOURCE != 'dummy' && steps.canonical.outputs.changed != 'true' && env.FORCE_REBUILD != 'true' }}
        run: echo "No canonical changes and force_rebuild=false; skipping snapshot, Cloudflare Pages deploy, and Astro dispatch."
      - name: Capture deploy commit
        id: deploy_commit
        if: ${{ env.SOURCE == 'dummy' || steps.canonical.outputs.changed == 'true' || env.FORCE_REBUILD == 'true' }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: npm run build-snapshot
        if: ${{ env.SOURCE == 'dummy' || steps.canonical.outputs.changed == 'true' || env.FORCE_REBUILD == 'true' }}
      - run: npm run build-search
        if: ${{ env.SOURCE == 'dummy' || steps.canonical.outputs.changed == 'true' || env.FORCE_REBUILD == 'true' }}
      - name: Evals
        if: ${{ env.SOURCE == 'dummy' || steps.canonical.outputs.changed == 'true' || env.FORCE_REBUILD == 'true' }}
        run: |
          if npm run run-evals; then
            exit 0
          fi
          if [ -n "${{ inputs.eval_bypass_reason }}" ]; then
            echo "Eval bypass requested: ${{ inputs.eval_bypass_reason }}"
            exit 0
          fi
          exit 1
      - run: npm run build-site
        if: ${{ env.SOURCE == 'dummy' || steps.canonical.outputs.changed == 'true' || env.FORCE_REBUILD == 'true' }}
        env:
          FORKCAST_RAW_RECORD_BASE: https://raw.githubusercontent.com/dionysuzx/forkcast-data/${{ steps.deploy_commit.outputs.sha }}/records
      - name: Capture snapshot id
        if: ${{ env.SOURCE == 'dummy' || steps.canonical.outputs.changed == 'true' || env.FORCE_REBUILD == 'true' }}
        id: snapshot
        run: |
          snapshot_id="$(node -e "const fs=require('fs'); console.log(JSON.parse(fs.readFileSync('dist/latest/manifest.json', 'utf8')).snapshot_id)")"
          echo "snapshot_id=$snapshot_id" >> "$GITHUB_OUTPUT"
          echo "snapshot_id=$snapshot_id"
      - run: npm run compact-dist
        if: ${{ env.SOURCE == 'dummy' || steps.canonical.outputs.changed == 'true' || env.FORCE_REBUILD == 'true' }}
        env:
          FORKCAST_STATIC_HOST: cloudflare-pages
      - uses: actions/upload-artifact@v4
        if: ${{ env.SOURCE == 'dummy' || steps.canonical.outputs.changed == 'true' || env.FORCE_REBUILD == 'true' }}
        with:
          name: forkcast-data-dist
          path: dist
      - name: Deploy data site to Cloudflare Pages
        id: deployment
        if: ${{ env.SOURCE == 'dummy' || steps.canonical.outputs.changed == 'true' || env.FORCE_REBUILD == 'true' }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN secret is required for Cloudflare Pages deploys" >&2
            exit 1
          fi
          npx wrangler pages deploy dist \
            --project-name forkcast-data \
            --branch main \
            --commit-hash "${{ steps.deploy_commit.outputs.sha }}" \
            --commit-message "Forkcast data snapshot ${{ steps.snapshot.outputs.snapshot_id }}"
      - name: Dispatch forkcast-astro rebuild
        if: ${{ env.SOURCE == 'dummy' || steps.canonical.outputs.changed == 'true' || env.FORCE_REBUILD == 'true' }}
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.FORKCAST_ASTRO_DISPATCH_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'dionysuzx',
              repo: 'forkcast-astro',
              event_type: 'forkcast-data-snapshot',
              client_payload: {
                snapshot: '${{ steps.snapshot.outputs.snapshot_id }}',
                source: '${{ env.SOURCE }}',
                data_site: process.env.FORKCAST_DATA_SITE_URL
              }
            })
