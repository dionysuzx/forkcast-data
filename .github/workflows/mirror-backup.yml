name: Mirror Backup

on:
  workflow_dispatch: {}
  schedule:
    - cron: "43 3 * * *"

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      MIRROR_REMOTE_URL: ${{ secrets.MIRROR_REMOTE_URL }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Mirror not configured
        if: ${{ env.MIRROR_REMOTE_URL == '' }}
        run: echo "MIRROR_REMOTE_URL is not configured; skipping mirror backup."
      - name: Push mirror when configured
        if: ${{ env.MIRROR_REMOTE_URL != '' }}
        run: |
          git remote add mirror "$MIRROR_REMOTE_URL"
          git push mirror --mirror
