name: Mirror Backup

on:
  workflow_dispatch: {}
  schedule:
    - cron: "43 3 * * *"

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Push mirror when configured
        if: ${{ secrets.MIRROR_REMOTE_URL != '' }}
        run: |
          git remote add mirror "${{ secrets.MIRROR_REMOTE_URL }}"
          git push mirror --mirror
