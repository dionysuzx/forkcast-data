name: Deploy Netlify

on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "preview or prod"
        required: true
        default: "preview"
        type: choice
        options: ["preview", "prod"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run verify
      - name: Deploy preview
        if: ${{ inputs.deploy_target == 'preview' }}
        run: npx netlify deploy --dir=dist --functions=netlify/functions
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      - name: Deploy production
        if: ${{ inputs.deploy_target == 'prod' }}
        run: npx netlify deploy --prod --dir=dist --functions=netlify/functions
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
